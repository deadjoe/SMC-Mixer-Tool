name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build tests
        run: cmake --build build --target SMCMixerCoreTests SMCMixerUITests -j 4

      - name: Run core tests
        run: ./build/SMCMixerCoreTests

      - name: Run UI tests
        run: ./build/SMCMixerUITests_artefacts/Debug/SMCMixerUITests --render ui-renders

      - name: Keep the UI renders
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-renders
          path: ui-renders
          if-no-files-found: ignore

      - name: Build the app
        run: cmake --build build --target SMCMixerGUI -j 4
